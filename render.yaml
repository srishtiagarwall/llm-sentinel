# Render Blueprint — deploys the full stack from one file.
# https://render.com/docs/blueprint-spec
#
# Topology (see README.md's "Deploying to Render" section for the full walkthrough):
#   - postgres                      managed data store (Render free tier)
#   - api, gateway, eval-service    public Docker web services (eval-service is a web
#                                    service only because Render's free tier has no
#                                    Background Worker plan — see its comment below)
#   - dashboard                     static site (Vite build), talks to `api` over HTTPS + WSS
#
# No Redis service here on purpose: Redis is only used by gateway's
# PolicyCacheService (api doesn't touch it, and gateway's rate limiter is
# in-memory per ADR 0001, not Redis-backed) — and that cache already fails
# open on any Redis error, falling back to fetching policies directly from
# `api` on every request (see PolicyCacheService.getEnabledPolicies). Render's
# free tier allows only one Key Value instance per account; rather than force
# you to either give one up or pay, this deploy just runs without the cache.
# If you want it, add a Key Value service and REDIS_URL back in — nothing
# else needs to change.
#
# All four app Dockerfiles build from the repo root context (npm workspaces
# monorepo) — see the comment at the top of each Dockerfile. Render's
# `dockerContext: .` + `dockerfilePath` mirrors docker-compose.yml exactly.
#
# Free-tier caveats (see README): free Postgres expires after 30 days unless
# upgraded; free web services spin down after 15 min idle and take ~30-60s to
# wake on the next request — expect a cold-start delay on first load after
# a period of inactivity.

databases:
  - name: llm-sentinel-postgres
    plan: free
    databaseName: llm_sentinel
    user: llm_sentinel

services:
  - type: web
    name: llm-sentinel-api
    runtime: docker
    dockerContext: .
    dockerfilePath: ./api/Dockerfile
    plan: free
    # No unauthenticated GET route exists anywhere in `api` to use as a
    # healthCheckPath (every real endpoint requires a JWT; the boilerplate
    # root AppController route is dead code — never registered in
    # AppModule). Omitting healthCheckPath falls back to Render's default
    # TCP-port check, which is sufficient here.
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: llm-sentinel-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: llm-sentinel-gateway
    runtime: docker
    dockerContext: .
    dockerfilePath: ./gateway/Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: llm-sentinel-postgres
          property: connectionString
      - key: JWT_SECRET
        sync: false # set manually to the exact same value as llm-sentinel-api's JWT_SECRET — see README
      - key: QUEUE_BACKEND
        value: postgres # gateway and eval-service are separate Render machines with no shared disk — the
                         # local-file queue (used by default in docker-compose/local dev) can't cross that
                         # gap, so this deploy uses the Postgres-backed queue instead. See libs/queue/src/postgres-queue.ts.
      - key: GEMINI_API_KEY
        sync: false # set manually — https://aistudio.google.com/apikey
      - key: API_SERVICE_URL
        fromService:
          type: web
          name: llm-sentinel-api
          property: hostport

  - type: web
    name: llm-sentinel-eval-service
    runtime: docker
    dockerContext: .
    dockerfilePath: ./eval-service/Dockerfile
    plan: free
    # Render's free tier has no Background Worker plan — this runs as a Web
    # Service instead. eval-service's real job (polling the trace-eval
    # queue) starts on module init and is unrelated to HTTP; the listen()
    # call in main.ts exists only so this satisfies Render's web-service
    # port requirement. See main.ts's comment and the README's Render
    # walkthrough. Nothing needs to actually call this service's HTTP
    # endpoint for it to do its job.
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: llm-sentinel-postgres
          property: connectionString
      - key: JWT_SECRET
        sync: false # must match llm-sentinel-api and llm-sentinel-gateway exactly
      - key: QUEUE_BACKEND
        value: postgres # must match llm-sentinel-gateway's setting — same reasoning
      - key: GEMINI_API_KEY
        sync: false
      - key: API_SERVICE_URL
        fromService:
          type: web
          name: llm-sentinel-api
          property: hostport

  - type: web
    name: llm-sentinel-dashboard
    runtime: static
    buildCommand: >-
      npm ci &&
      npm run build:libs &&
      npm run build -w dashboard
    staticPublishPath: ./dashboard/dist
    envVars:
      # Render's Blueprint spec has no way to reference another service's
      # PUBLIC onrender.com URL (fromService only exposes the private-network
      # host:port, which a browser can't reach) — VITE_API_URL is also baked
      # into the static JS bundle at build time, not read at runtime, so it
      # has to be a real value here, not resolved dynamically. Set this to
      # llm-sentinel-api's actual public URL after its first deploy (visible
      # on its Render dashboard page), then trigger a manual redeploy of this
      # static site so the build picks it up. See README's Render walkthrough.
      - key: VITE_API_URL
        value: https://llm-sentinel-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html # React Router client-side routing — see dashboard/nginx.conf for the equivalent local/Docker rule
