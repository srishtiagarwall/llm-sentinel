server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # React Router uses client-side routing (BrowserRouter) — any path that
    # isn't a real static file must fall back to index.html so e.g. a direct
    # load of /traces or a page refresh doesn't 404 against nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
