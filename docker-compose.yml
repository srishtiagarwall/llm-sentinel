version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: llm_sentinel
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    env_file:
      - ./gateway/.env
    depends_on:
      - postgres
      - redis

  eval-service:
    build:
      context: ./eval-service
      dockerfile: Dockerfile
    env_file:
      - ./eval-service/.env
    depends_on:
      - postgres

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - '3001:3001'
    env_file:
      - ./api/.env
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  redis_data:
