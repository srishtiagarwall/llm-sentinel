version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: llm_sentinel
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  gateway:
    build:
      # Root context, not ./gateway — this is an npm workspaces monorepo, and
      # gateway/Dockerfile needs the root package-lock.json plus libs/* to
      # build gateway's workspace dependencies. See gateway/Dockerfile's
      # top-of-file comment.
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - '3000:3000'
    env_file:
      - ./gateway/.env
    depends_on:
      - postgres
      - redis

  eval-service:
    build:
      context: .
      dockerfile: eval-service/Dockerfile
    env_file:
      - ./eval-service/.env
    depends_on:
      - postgres

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - '3001:3001'
    env_file:
      - ./api/.env
    depends_on:
      - postgres
      - redis

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    ports:
      - '5173:80'
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
